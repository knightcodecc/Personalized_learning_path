{% extends "base.html" %}

{% block content %}
<div class="login-page">
	<div class="login-container">
		<div class="login-header">
			<div class="logo-large">
				<i data-lucide="lock"></i>
				<h1>Welcome back</h1>
			</div>
			<p class="subtitle">Sign in to continue your learning journey</p>
		</div>

		<form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
			<div class="form-group">
				<label for="identifier">Email or Username</label>
				<input type="text" id="identifier" name="identifier" required minlength="3" placeholder="you@example.com">
			</div>
			<div class="form-group">
				<label for="password">Password</label>
				<input type="password" id="password" name="password" required minlength="6" placeholder="••••••••">
			</div>

			<button type="submit" class="btn btn-primary btn-block btn-large">Sign In</button>
		</form>

		<div class="login-footer">
			<a href="#" onclick="forgotPassword()">Forgot Password?</a>
			<span> · </span>
			<a href="/register">Sign Up</a>
		</div>
	</div>
</div>
{% endblock %}

{% block extra_js %}
<script>
	async function handleLogin(event){
		event.preventDefault();
		const id = document.getElementById('identifier').value.trim();
		const pw = document.getElementById('password').value;
		if(id.length < 3){ showToast('Please enter a valid email/username', 'error'); return; }
		if(pw.length < 6){ showToast('Password must be at least 6 characters', 'error'); return; }
		try{
			showLoading();
			await window.auth.login(id, pw);
			showToast('Signed in successfully', 'success');
			setTimeout(()=>{ window.location.href = '/onboarding'; }, 400);
		}catch(e){
			showToast(e.message || 'Login failed', 'error');
		}finally{
			hideLoading();
		}
	}

	function forgotPassword(){
		showToast('Password reset coming soon', 'info');
	}
</script>
{% endblock %}
